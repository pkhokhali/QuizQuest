# One-click deploy of the QuizQuest API on Render (https://render.com).
# After the service is live, set these GitHub repo Variables and rerun the
# "Build Android APK" + "Deploy admin portal" workflows:
#   APP_API_URL   = https://<your-service>.onrender.com
#   ADMIN_API_URL = https://<your-service>.onrender.com
services:
  - type: web
    name: quizquest-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npm run seed
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # Strong signing secret for JWTs — generated once by Render, never in git.
      - key: JWT_SECRET
        generateValue: true
      # Restrict browser origins in production. Set to your admin Pages URL, e.g.
      # https://pkhokhali.github.io  (comma-separate multiple origins).
      - key: CORS_ORIGIN
        value: "*"
