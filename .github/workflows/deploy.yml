name: Deploy to VPS

on:
  push:
    branches: [ main ]
    paths:
      - 'server/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}       # e.g., 110.34.21.180 or domain
          username: ${{ secrets.VPS_USER }}   # e.g., subisus3
          key: ${{ secrets.VPS_SSH_KEY }}     # Your private SSH key (or use password)
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /quizquest
            git pull origin main
            cd server
            pm2 restart all
