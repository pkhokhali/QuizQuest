name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      api_url:
        description: "Backend API URL baked into the APK"
        required: false
        default: ""

permissions:
  contents: write # needed to attach the APK to tagged releases

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci
        working-directory: app

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        working-directory: app

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: app/android
        env:
          # Priority: manual run input -> APP_API_URL repository variable -> localhost fallback.
          EXPO_PUBLIC_API_URL: ${{ github.event.inputs.api_url || vars.APP_API_URL || 'http://localhost:4000' }}

      - name: Rename APK
        run: cp app/android/app/build/outputs/apk/release/app-release.apk QuizQuest.apk

      - uses: actions/upload-artifact@v4
        with:
          name: QuizQuest-apk
          path: QuizQuest.apk
          retention-days: 30

      # Tagged builds (git tag v1.0.0 && git push --tags) also publish the APK
      # as a GitHub Release so it has a permanent download link.
      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: QuizQuest.apk
