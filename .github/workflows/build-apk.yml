name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      api_url:
        description: "Backend API URL baked into the APK (phone must be able to reach this)"
        required: false
        default: ""

permissions:
  contents: write # needed to attach the APK to tagged releases

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve API URL
        id: api
        env:
          INPUT_URL: ${{ github.event.inputs.api_url }}
          VAR_URL: ${{ vars.APP_API_URL }}
        run: |
          URL="${INPUT_URL:-}"
          if [ -z "$URL" ]; then URL="${VAR_URL:-}"; fi
          if [ -z "$URL" ]; then
            echo "::error::No API URL set. Re-run this workflow with the api_url input, or set the APP_API_URL repository variable (Settings → Secrets and variables → Actions → Variables) to your QuizQuest server URL, e.g. http://192.168.0.111:4000 or https://quizquest-api.onrender.com"
            exit 1
          fi
          # Available to every later step (Expo prebuild + Metro bundle inside Gradle).
          echo "EXPO_PUBLIC_API_URL=$URL" >> "$GITHUB_ENV"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Building APK against API: $URL"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci
        working-directory: app

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        working-directory: app

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: app/android

      - name: Rename APK
        run: cp app/android/app/build/outputs/apk/release/app-release.apk QuizQuest.apk

      - uses: actions/upload-artifact@v4
        with:
          name: QuizQuest-apk
          path: QuizQuest.apk
          retention-days: 30

      # Tagged builds (git tag v1.0.0 && git push --tags) also publish the APK
      # as a GitHub Release so it has a permanent download link.
      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: QuizQuest.apk
