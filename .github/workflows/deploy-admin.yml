name: Deploy admin portal to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "admin/**"
      - ".github/workflows/deploy-admin.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: admin

      - name: Resolve API URL
        id: api
        env:
          ADMIN_URL: ${{ vars.ADMIN_API_URL }}
          APP_URL: ${{ vars.APP_API_URL }}
        run: |
          URL="${ADMIN_URL:-}"
          if [ -z "$URL" ]; then URL="${APP_URL:-}"; fi
          if [ -z "$URL" ]; then
            echo "::error::Set ADMIN_API_URL (or APP_API_URL) repository variable to your QuizQuest server URL so the portal can talk to the API."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Building portal against API: $URL"

      - name: Build static export
        run: npm run build
        working-directory: admin
        env:
          # Project site is served from https://<user>.github.io/QuizQuest/
          NEXT_PUBLIC_BASE_PATH: /QuizQuest
          NEXT_PUBLIC_API_URL: ${{ steps.api.outputs.url }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: admin/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
