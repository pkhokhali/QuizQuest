name: Deploy admin portal to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "admin/**"
      - ".github/workflows/deploy-admin.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: admin

      - name: Build static export
        run: npm run build
        working-directory: admin
        env:
          # Project site is served from https://<user>.github.io/QuizQuest/
          NEXT_PUBLIC_BASE_PATH: /QuizQuest
          # Set the ADMIN_API_URL repository variable to your deployed backend URL
          # (Settings -> Secrets and variables -> Actions -> Variables).
          NEXT_PUBLIC_API_URL: ${{ vars.ADMIN_API_URL || 'http://localhost:4000' }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: admin/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
